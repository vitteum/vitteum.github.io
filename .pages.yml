media:
  input: media
  output: /media

content:
  - name: books
    label: BOOKS
    type: collection
    path: _books

    view:
      fields: [title, author, publication_date]

    fields:
      - name: title
        label: 도서명
        type: string
        required: true

      - name: subtitle
        label: 부제
        type: string

      - name: original_title
        label: 원제
        type: string

      - name: author
        label: 저자
        type: string

      - name: translator
        label: 역자
        type: string

      - name: publication_date
        label: 출간일
        type: date

      - name: status
        label: 출간 상태
        type: select
        options:
          values:
            - published
            - forthcoming

      - name: isbn
        label: ISBN
        type: string

      - name: price
        label: 정가
        type: number

      - name: pages
        label: 페이지 수
        type: number

      - name: format
        label: 판형 및 제본
        type: string

      - name: cover
        label: 표지 이미지
        type: image

      - name: description
        label: 검색엔진 설명
        type: text

      - name: keywords
        label: 검색 키워드
        type: string

      - name: aladin
        label: 알라딘 구매 링크
        type: string

      - name: yes24
        label: YES24 구매 링크
        type: string

      - name: kyobo
        label: 교보문고 구매 링크
        type: string

      # 도서 상세 콘텐츠

      - name: body
        label: 책 소개
        type: rich-text

      - name: table_of_contents
        label: 목차
        type: rich-text

      - name: author_bio
        label: 저자 소개
        type: rich-text

      - name: translator_bio
        label: 역자 소개
        type: rich-text

      - name: recommendations
        label: 추천사
        type: rich-text

  - name: notes
    label: NOTES
    type: collection
    path: _notes

    fields:
      - name: title
        label: 글 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date

      - name: description
        label: 요약
        type: text

      - name: body
        label: 본문
        type: rich-text

  - name: about
    label: ABOUT
    type: file
    path: about/index.md
    fields:
      - name: layout
        label: 레이아웃
        type: hidden
        default: default

      - name: title
        label: 페이지 제목
        type: string
        required: true

      - name: body
        label: 출판사 소개
        type: rich-text
