media:
  input: media
  output: /media

content:
  - name: books
    label: BOOKS
    type: collection
    path: _books

    view:
      fields: [title, author, publication_date]

    fields:
      - name: title
        label: 도서명
        type: string
        required: true

      - name: subtitle
        label: 부제
        type: string

      - name: original_title
        label: 원제
        type: string

      - name: author
        label: 저자
        type: string

      - name: translator
        label: 역자
        type: string

      - name: publication_date
        label: 출간일
        type: date

      - name: status
        label: 출간 상태
        type: select
        options:
          values:
            - published
            - forthcoming

      - name: isbn
        label: ISBN
        type: string

      - name: price
        label: 정가
        type: number

      - name: pages
        label: 페이지 수
        type: number

      - name: format
        label: 판형 및 제본
        type: string

      - name: cover
        label: 표지 이미지
        type: image

      - name: description
        label: 검색엔진 설명
        type: text

      - name: keywords
        label: 검색 키워드
        type: string

      - name: aladin
        label: 알라딘 구매 링크
        type: string

      - name: yes24
        label: YES24 구매 링크
        type: string

      - name: kyobo
        label: 교보문고 구매 링크
        type: string

      - name: ebook_aladin
        label: 알라딘 전자책 구매 링크
        type: string

      - name: ebook_yes24
        label: YES24 전자책 구매 링크
        type: string

      - name: ebook_kyobo
        label: 교보문고 전자책 구매 링크
        type: string

      # 도서 상세 콘텐츠

      - name: body
        label: 책 소개
        type: rich-text

      - name: table_of_contents
        label: 목차
        type: rich-text

      - name: author_bio
        label: 저자 소개
        type: rich-text

      - name: translator_bio
        label: 역자 소개
        type: rich-text

      - name: recommendations
        label: 추천사
        type: rich-text

      # 외부 서평

      - name: external_reviews
        label: 외부 서평
        type: object
        list: true

        fields:
          - name: source
            label: 매체명
            type: string

          - name: title
            label: 서평 제목
            type: string
            required: true

          - name: url
            label: 서평 URL
            type: string
            required: true


      - name: related_content
        label: 관련 콘텐츠
        type: object
        list: true
        fields:
          - name: title
            label: 콘텐츠 제목
            type: string
            required: true
          - name: url
            label: 콘텐츠 URL
            type: string
            required: true

      - name: tour_apple_music
        label: TOUR Apple Music 플레이리스트 URL
        type: string

      - name: tour_instagram
        label: TOUR 인스타그램 게시물
        type: object
        list: true
        fields:
          - name: title
            label: 게시물 제목
            type: string
            required: true
          - name: url
            label: 인스타그램 게시물 URL
            type: string
            required: true
          - name: image
            label: 대표 이미지
            type: image

  - name: tour
    label: TOUR
    type: file
    path: _data/tour.json
    format: json
    fields:
      - name: heading
        label: 투어 제목
        type: string
        required: true
      - name: guide_heading
        label: 독서 안내 제목
        type: string
        required: true
      - name: guide_intro
        label: 독서 안내 소개
        type: text
        required: true
      - name: music_heading
        label: 음악 섹션 제목
        type: string
        required: true
      - name: instagram_heading
        label: 인스타그램 섹션 제목
        type: string
        required: true
      - name: reading_heading
        label: 함께 읽을 거리 제목
        type: string
        required: true
      - name: questions
        label: 독서 안내 문항
        type: object
        list: true
        fields:
          - name: prompt
            label: 질문
            type: string
            required: true
          - name: a
            label: 선택지 · 2장 낙인과 수치심
            type: string
            required: true
          - name: b
            label: 선택지 · 5장 자기 인식과 고립
            type: string
            required: true
          - name: c
            label: 선택지 · 6장 상실 이후의 관계
            type: string
            required: true
          - name: d
            label: 선택지 · 7장 관계의 이름과 방식
            type: string
            required: true
      - name: result_0
        label: 추천 결과 · 2장
        type: object
        fields:
          - name: title
            label: 결과 제목
            type: string
            required: true
          - name: description
            label: 추천 설명
            type: text
            required: true
      - name: result_1
        label: 추천 결과 · 5장
        type: object
        fields:
          - name: title
            label: 결과 제목
            type: string
            required: true
          - name: description
            label: 추천 설명
            type: text
            required: true
      - name: result_2
        label: 추천 결과 · 6장
        type: object
        fields:
          - name: title
            label: 결과 제목
            type: string
            required: true
          - name: description
            label: 추천 설명
            type: text
            required: true
      - name: result_3
        label: 추천 결과 · 7장
        type: object
        fields:
          - name: title
            label: 결과 제목
            type: string
            required: true
          - name: description
            label: 추천 설명
            type: text
            required: true
      - name: apple_music
        label: Apple Music 플레이리스트 URL
        type: string
      - name: instagram
        label: 인스타그램 게시물
        type: object
        list: true
        fields:
          - name: title
            label: 게시물 제목
            type: string
            required: true
          - name: url
            label: 게시물 URL
            type: string
            required: true
          - name: image
            label: 대표 이미지
            type: image
      - name: reading
        label: 함께 읽을 거리
        type: object
        list: true
        fields:
          - name: title
            label: 링크 제목
            type: string
            required: true
          - name: url
            label: 링크 URL
            type: string
            required: true

  - name: notes
    label: NOTES
    type: collection
    path: _notes

    fields:
      - name: title
        label: 글 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date

      - name: description
        label: 요약
        type: text

      - name: body
        label: 본문
        type: rich-text


  - name: about
    label: ABOUT
    type: file
    path: about/index.md

    fields:
      - name: title
        label: 페이지 제목
        type: string
        required: true

      - name: description
        label: 검색엔진 설명
        type: text

      - name: body
        label: 출판사 소개
        type: rich-text



