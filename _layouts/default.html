<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
{% assign page_title = page.title | default: site.title %}{% assign page_description = page.description | default: site.description %}
<title>{{ page_title | escape }} | 빛틈</title><meta name="description" content="{{ page_description | strip_html | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}"><meta property="og:type" content="{% if page.layout == 'book' %}book{% else %}website{% endif %}"><meta property="og:title" content="{{ page_title | escape }}"><meta property="og:description" content="{{ page_description | strip_html | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ page.cover | default: '/thumbnail.png' | absolute_url }}">
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/content.css"></head>
<body><header class="top"><a href="/" class="wordmark"><picture>

  <source srcset="/logo_white.png" media="(prefers-color-scheme: dark)">

  <img src="/logo.png" alt="빛틈">

</picture></a><nav><a href="/books/">BOOKS</a><a href="/notes/">NOTES</a><a href="/about/">ABOUT</a></nav></header>
<main class="content">{{ content }}</main><footer class="content-footer"><a href="https://www.instagram.com/vitteum" target="_blank" rel="noopener noreferrer">INSTAGRAM ↗</a> <span>© 빛틈</span></footer></body></html>
