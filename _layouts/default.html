<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% assign page_title = page.title | default: site.title %}
  {% assign page_description = page.description | default: site.description %}

  <title>{{ page_title | escape }} | 빛틈</title>

  <meta name="description"
        content="{{ page_description | strip_html | escape }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:type"
        content="{% if page.layout == 'book' %}book{% else %}website{% endif %}">

  <meta property="og:title"
        content="{{ page_title | escape }}">

  <meta property="og:description"
        content="{{ page_description | strip_html | escape }}">

  <meta property="og:url"
        content="{{ page.url | absolute_url }}">

  <meta property="og:image"
        content="{{ page.cover | default: '/thumbnail.png' | absolute_url }}">

  <!-- 파비콘 -->
  <link rel="icon" href="/favicon.ico">

  <!-- 스타일 -->
  <link rel="stylesheet" href="/content.css?v=3">

</head>

<body>

  <!-- =====================================
       상단 헤더
  ====================================== -->

  <header class="top">

    <!-- 빛틈 로고 -->
    <a href="/"
       class="wordmark"
       aria-label="빛틈 홈으로 이동">

      <picture>

        <!-- 다크 모드 로고 -->
        <source
          srcset="/logo_white.png"
          media="(prefers-color-scheme: dark)"
        >

        <!-- 기본 로고 -->
        <img
          src="/logo.png"
          alt="빛틈"
          width="48"
        >

      </picture>

    </a>

    <!-- MAIN -->
    <a href="/" class="main-link">
      MAIN
    </a>

    <!-- 오른쪽 메뉴 -->
    <nav aria-label="주 메뉴">

      <a href="/books/">
        BOOKS
      </a>

      <a href="/notes/">
        NOTES
      </a>

      <a href="/about/">
        ABOUT
      </a>

    </nav>

  </header>


  <!-- =====================================
       본문
  ====================================== -->

  <main class="content">

    {{ content }}

  </main>


  <!-- =====================================
       푸터
  ====================================== -->

  <footer class="content-footer">

    <a
      href="https://www.instagram.com/vitteum"
      target="_blank"
      rel="noopener noreferrer"
    >
      INSTAGRAM ↗
    </a>

    <span>© 빛틈</span>

  </footer>

</body>
</html>
