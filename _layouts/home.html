<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="keywords" content="빛틈, 빛틈프레스, 빛틈출판사, vitteum">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% else %}ko_KR{% endif %}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="https://www.vitteum.com/thumbnail.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="https://www.vitteum.com/thumbnail.png">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"빛틈","alternateName":"Vitteum","url":"https://www.vitteum.com/","logo":"https://www.vitteum.com/logo.png","description":{{ page.description | jsonify }},"sameAs":["https://www.instagram.com/vitteum"]}</script>
  {% include language.html head=true %}
  <link rel="stylesheet" href="/styles.css?v=6">
</head>
<body>
  <main class="stage" aria-label="{{ page.publisher }}">
    {% if page.lang == 'en' %}
    <picture class="brand brand-en">
      <source srcset="{{ '/media/vitteum-wordmark-white.svg' | relative_url }}" media="(prefers-color-scheme: dark)">
      <img src="{{ '/media/vitteum-wordmark.svg' | relative_url }}" alt="Vitteum" width="430" height="172">
    </picture>
    {% else %}
    <picture class="brand">
      <source srcset="/logo_white.png" media="(prefers-color-scheme: dark)">
      <img src="/logo.png" alt="{{ page.title }}" width="90" height="104">
    </picture>
    {% endif %}
<!-- 물 위에서 움직이는 오리 -->
<a
  class="duck-link"
  href="{{ page.books_url }}"
  aria-label="{{ page.books_label }}"
  title="{{ page.books_label }}"
>
  <span class="duck-float">
    <picture class="duck">
      <source
        srcset="/duck_white.png"
        media="(prefers-color-scheme: dark)"
      >
      <img
        src="/duck.png"
        alt=""
        aria-hidden="true"
      >
    </picture>
  </span>
</a>
    <div class="wave-container" aria-hidden="true">
      <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
        <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z"/></defs>
        <g class="parallax">
          <use href="#gentle-wave" x="48" y="0"/>
          <use href="#gentle-wave" x="48" y="3"/>
          <use href="#gentle-wave" x="48" y="5"/>
          <use href="#gentle-wave" x="48" y="7"/>
        </g>
      </svg>
    </div>
  </main>
  <footer>
    <a class="instagram-link" href="https://www.instagram.com/vitteum" target="_blank" rel="noopener noreferrer" aria-label="{{ page.instagram_label }}">
      {% include instagram-icon.html size=24 %}
    </a>
    {% include language.html show_current=true %}
  </footer>

</body>
</html>
