{%- assign korean_url = page.ko_url | default: page.url -%}
{%- assign english_page = site.pages | where: 'ko_url', korean_url | first -%}
{%- if english_page -%}
  {% if include.head %}
    <link rel="alternate" hreflang="ko" href="{{ korean_url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ english_page.url | absolute_url }}">
  {% elsif page.lang == 'en' %}
    <a class="language-link" href="{{ korean_url | relative_url }}" lang="ko" hreflang="ko">한국어</a>
  {% else %}
    <a class="language-link" href="{{ english_page.url | relative_url }}" lang="en" hreflang="en">English</a>
  {% endif %}
{%- endif -%}
